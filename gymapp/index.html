<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Verdient</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verdient">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section id="screen-home" class="screen"></section>
  <section id="screen-inv" class="screen"></section>
  <section id="screen-shop" class="screen"></section>
  <section id="screen-settings" class="screen"></section>
  <section id="screen-done" class="screen"></section>
  <section id="screen-onb" class="screen"></section>
  <section id="screen-lock" class="screen"></section>
  <section id="screen-pro" class="screen"></section>
  <section id="screen-how" class="screen"></section>

  <!-- Kamera -->
  <section id="screen-train" class="screen">
    <div id="stage" class="mirror">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="overlay"></canvas>
      <div class="shade-top"></div>
      <div class="shade-bottom"></div>
      <div id="flash"></div>
    </div>

    <div class="hud">
      <div class="hud-top">
        <button class="circle-btn glass" id="btn-close" type="button" aria-label="Abbrechen">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="pill glass"><span class="dot" id="state-dot"></span><span id="pill-text">Liegestütze</span></div>
        <button class="circle-btn glass" id="btn-sound" type="button" aria-label="Ton an oder aus" aria-pressed="true">
          <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
        </button>
      </div>

      <div class="hud-mid">
        <div>
          <div class="count" id="count">0</div>
          <div class="count-label" id="count-label">Wiederholungen</div>
        </div>
        <div class="chip" id="chip">+0 Punkte</div>
      </div>

      <div class="gauge" id="gauge">
        <div class="gauge-label" id="gauge-label">–</div>
        <div class="gauge-track"><div class="gauge-fill" id="gauge-fill"></div></div>
      </div>

      <div id="debug"></div>

      <div class="hud-bottom" id="hud-bottom">
        <div class="zoombar glass" id="zoombar" role="group" aria-label="Zoom">
          <button type="button" data-z="0.5">0,5×</button><button type="button" data-z="1" class="on">1×</button><button type="button" data-z="2">2×</button><button type="button" data-flip="1" aria-label="Kamera wechseln" style="min-width:44px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg></button>
        </div>
        <div class="zoomtip" id="zoomtip" hidden></div>
        <div class="hint-title" id="hint-title">Bereit.</div>
        <div class="hint-sub" id="hint-sub"></div>
        <button class="btn-end" id="btn-end" type="button">Training beenden</button>
      </div>
    </div>

    <div class="center-overlay" id="ov-loading">
      <div class="spinner"></div>
      <div class="cd-text" id="loading-text">Kamera wird gestartet …</div>
    </div>
    <div class="center-overlay" id="ov-setup">
      <div class="sc-title">Aufbau prüfen</div>
      <ul class="sc-list">
        <li id="sc-body"><i></i>Ganzer Körper im Bild</li>
        <li id="sc-dist"><i></i>Abstand ok</li>
        <li id="sc-light"><i></i>Licht ok</li>
      </ul>
      <div class="cd-text" id="sc-tip" style="min-height:3em;font-size:15px;opacity:.9"></div>
      <button class="btn-main" type="button" data-act="setup-go" style="max-width:260px;margin-top:14px">Trotzdem starten</button>
    </div>
    <div class="center-overlay" id="ov-countdown">
      <div class="cd-num" id="cd-num">5</div>
      <div class="cd-text">In Position gehen. Ganzer Körper muss im Bild sein.</div>
      <div class="cd-text" id="cd-tip" style="margin-top:10px;font-size:15px;opacity:.85"></div>
    </div>
    <div class="center-overlay" id="ov-error">
      <div class="err-title" id="err-title">Das hat nicht geklappt</div>
      <div class="err-text" id="err-text"></div>
      <button class="btn-main" id="btn-err-back" type="button" style="max-width:260px;margin-top:14px">Zurück</button>
    </div>
  </section>

  <nav id="nav" aria-label="Hauptmenü">
    <button type="button" data-go="home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10.5v3M21 10.5v3M6 12h12"/></svg>Training
    </button>
    <button type="button" data-go="inv">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>Inventar
    </button>
    <button type="button" data-go="shop">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9h16M4 9v10h16V9M9 19v-5h6v5"/></svg>Shop
    </button>
  </nav>

  <div id="modal" class="modal" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<script src="counter.js"></script>
<script src="tut3d.js"></script>
<script src="glass.js"></script>
<script src="store.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
